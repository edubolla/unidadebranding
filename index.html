<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atributos da Marca — Unidade Branding</title>
<meta name="description" content="Formulário de atributos da marca — Unidade Branding.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Open+Sans:wdth,wght@75..100,400;75..100,600&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FCD307;
    --red:#E84A43;
    --bg:#F3F3F3;
    --ink:#000;
    --paper:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Open Sans","Open Sans Condensed",Arial,sans-serif;
    font-stretch:75%;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:var(--ink);
    border-bottom:6px solid var(--yellow);
    padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar img{height:44px;width:auto;display:block}
  .topbar span{
    color:var(--yellow);font-family:"Roboto Condensed",sans-serif;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;font-size:13px;
  }
  main{max-width:860px;margin:0 auto;padding:40px 16px 56px}
  .sheet{background:var(--paper);padding:48px 24px 56px}
  h1{
    font-family:"Roboto Condensed",sans-serif;font-weight:700;
    font-size:clamp(34px,6vw,46px);letter-spacing:.02em;text-transform:uppercase;
    text-align:center;margin:0 0 6px;line-height:1.1;
  }
  .rule{width:72px;height:6px;background:var(--yellow);margin:0 auto 34px}

  .meta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:46px}
  .field{
    flex:1 1 260px;max-width:300px;
    display:flex;align-items:center;gap:6px;
    border:1.5px solid var(--ink);border-radius:999px;
    padding:6px 14px;background:#fff;
  }
  .field label{font-family:"Roboto Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em}
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font:inherit;font-size:14px;color:var(--ink);
  }
  .field:focus-within{box-shadow:0 0 0 3px var(--yellow)}

  /* scale */
  .scale{position:relative;max-width:760px;margin:0 auto}
  .row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;column-gap:18px;
    height:68px;
  }
  .lbl{font-family:"Roboto Condensed",sans-serif;font-size:clamp(18px,3.4vw,25px);line-height:1}
  .lbl.l{text-align:right}
  .lbl.r{text-align:left}
  .dots{display:flex;gap:clamp(8px,2.4vw,24px)}
  .dots label{position:relative;display:block;cursor:pointer;width:26px;height:26px}
  .dots input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .dots i{
    position:absolute;inset:0;border:2px solid var(--ink);border-radius:50%;background:#fff;
    transition:background .12s, transform .12s;
  }
  .dots label:hover i{transform:scale(1.12);background:#fff6b8}
  .dots input:checked + i{background:var(--yellow);transform:none}
  .dots input:focus-visible + i{outline:3px solid var(--red);outline-offset:2px}
  /* center column outline */
  .center-frame{
    position:absolute;top:2px;bottom:2px;
    left:50%;width:50px;transform:translateX(-50%);
    border:2px solid var(--ink);border-radius:26px;pointer-events:none;
  }

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:44px}
  button{
    font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
    padding:14px 28px;border:2px solid var(--ink);border-radius:0;cursor:pointer;
    background:var(--yellow);color:var(--ink);transition:transform .1s, background .1s;
  }
  button:hover{background:var(--ink);color:var(--yellow)}
  button.ghost{background:#fff}
  button.ghost:hover{background:var(--red);border-color:var(--red);color:#fff}
  .hint{text-align:center;font-size:12px;color:#666;margin-top:18px}

  /* mobile: labels on one line, dots below */
  @media (max-width:640px){
    .sheet{padding:32px 10px 40px}
    .row{grid-template-columns:1fr 1fr;height:auto;row-gap:8px;column-gap:8px;padding:12px 0;border-bottom:1px solid #eee}
    .row .lbl.l{grid-column:1;grid-row:1;text-align:left;font-size:18px}
    .row .lbl.r{grid-column:2;grid-row:1;text-align:right;font-size:18px}
    .row .dots{grid-column:1 / -1;grid-row:2;justify-content:space-between;gap:0}
    .center-frame{display:none}
    .row .dots label:nth-child(4) i{border-width:3px}
    .topbar{padding:12px 16px}
  }

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    .topbar,.actions,.hint{display:none}
    main{padding:0;max-width:none}
    .sheet{padding:0}
    .dots i,.field,.center-frame{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<header class="topbar">
  <img src="logo.png" alt="Unidade Branding">
  <span>Unidade Branding</span>
</header>

<main>
  <form class="sheet" id="form" autocomplete="off" onsubmit="return false">
    <h1>Atributos da Marca</h1>
    <div class="rule"></div>

    <div class="meta">
      <div class="field"><label for="marca">MARCA:</label><input id="marca" name="marca" type="text"></div>
      <div class="field"><label for="data">DATA:</label><input id="data" name="data" type="text" inputmode="numeric" placeholder="dd/mm/aaaa"></div>
    </div>

    <div class="scale" id="scale">
      <div class="center-frame"></div>
    </div>

    <div class="actions">
      <button type="button" id="print">Salvar PDF / Imprimir</button>
      <button type="button" id="reset" class="ghost">Limpar</button>
    </div>
    <p class="hint">Clique novamente em uma opção marcada para desmarcá-la.</p>
  </form>
</main>

<script>
const PAIRS = [
  ["Inovadora","Tradicional"],
  ["Robusta","Delicada"],
  ["Minimalista","Complexa"],
  ["Extravagante","Reservada"],
  ["Jovem","Experiente"],
  ["Séria","Divertida"],
  ["Institucional","Humana"],
  ["Orgânica","Geométrica"],
  ["Acessível","Premium"],
  ["Nicho","Generalista"],
  ["Global","Local"],
];

const scale = document.getElementById('scale');
const frame = scale.querySelector('.center-frame');
PAIRS.forEach(([a,b],i)=>{
  const row = document.createElement('div');
  row.className = 'row';
  let dots = '';
  for(let v=1; v<=7; v++){
    dots += `<label><input type="radio" name="attr${i}" value="${v}" aria-label="${a} ↔ ${b}: ${v} de 7"><i></i></label>`;
  }
  row.innerHTML = `<div class="lbl l">${a}</div><div class="dots">${dots}</div><div class="lbl r">${b}</div>`;
  scale.insertBefore(row, frame);
});

/* allow unchecking by clicking the checked option again */
let wasChecked = null;
scale.addEventListener('pointerdown', e=>{
  const inp = e.target.closest('label')?.querySelector('input');
  wasChecked = inp && inp.checked ? inp : null;
});
scale.addEventListener('click', e=>{
  const inp = e.target.closest('label')?.querySelector('input');
  if(inp && wasChecked === inp){ inp.checked = false; }
  wasChecked = null;
});

/* date: default today + mask */
const data = document.getElementById('data');
const d = new Date();
data.value = [d.getDate(),d.getMonth()+1].map(n=>String(n).padStart(2,'0')).join('/') + '/' + d.getFullYear();
data.addEventListener('input', ()=>{
  const n = data.value.replace(/\D/g,'').slice(0,8);
  data.value = n.length>4 ? `${n.slice(0,2)}/${n.slice(2,4)}/${n.slice(4)}` : n.length>2 ? `${n.slice(0,2)}/${n.slice(2)}` : n;
});

/* actions */
document.getElementById('print').onclick = ()=>{
  const m = document.getElementById('marca').value.trim();
  const old = document.title;
  document.title = 'Atributos da Marca' + (m ? ' - ' + m : '');
  window.print();
  document.title = old;
};
document.getElementById('reset').onclick = ()=>{
  if(confirm('Limpar todas as respostas?')){
    document.getElementById('form').reset();
    data.value = [d.getDate(),d.getMonth()+1].map(n=>String(n).padStart(2,'0')).join('/') + '/' + d.getFullYear();
  }
};
</script>
</body>
</html>
